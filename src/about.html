<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>关于 — denohub</title>
    <meta
      name="description"
      content="了解 Denohub 的定位，以及游戏、开发与 AI 方向的全部子站。"
    />
    <meta name="theme-color" content="#fafafa" />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5061364613986259"
      crossorigin="anonymous"
    ></script>
    <link rel="canonical" href="https://denohub.com/about.html" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://denohub.com/about.html" />
    <meta property="og:title" content="关于 — denohub" />
    <meta
      property="og:description"
      content="了解 Denohub 的定位，以及游戏、开发与 AI 方向的全部子站。"
    />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary" />
    <script>
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem('denohub-theme');
        } catch {}
        const dark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#000000' : '#fafafa');
      })();
    </script>
  </head>
  <body>
    <div class="page-glow" aria-hidden="true"></div>

    <header class="sticky top-0 z-40 border-b border-line bg-canvas/80 backdrop-blur-md">
      <div class="mx-auto flex h-14 max-w-6xl items-center justify-between px-4 sm:px-6">
        <div class="flex items-center gap-2.5">
          <a
            href="/"
            class="flex items-center gap-2.5 rounded-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 focus-visible:ring-offset-canvas"
            aria-label="denohub 首页"
          >
            <span
              class="flex size-6 select-none items-center justify-center rounded-md bg-fg text-[13px] font-bold leading-none text-canvas"
              aria-hidden="true"
            >d</span>
            <span class="text-sm font-semibold tracking-tight">denohub</span>
          </a>
          <span class="h-4 w-px bg-line" aria-hidden="true"></span>
          <span class="text-sm text-muted">关于</span>
        </div>

        <div class="flex items-center gap-1.5">
          <a
            href="/"
            class="rounded-md px-2.5 py-1.5 text-sm text-muted transition-colors hover:text-fg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 focus-visible:ring-offset-canvas"
          >返回导航</a>
          <button
            id="theme-toggle"
            type="button"
            class="flex size-9 items-center justify-center rounded-md border border-line bg-surface text-muted transition-colors hover:border-line-strong hover:text-fg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 focus-visible:ring-offset-canvas"
            aria-label="切换到暗色模式"
            title="切换到暗色模式"
          >
            <svg
              class="size-[18px] dark:hidden"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
            </svg>
            <svg
              class="hidden size-[18px] dark:block"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2" />
              <path d="M12 20v2" />
              <path d="m4.93 4.93 1.41 1.41" />
              <path d="m17.66 17.66 1.41 1.41" />
              <path d="M2 12h2" />
              <path d="M20 12h2" />
              <path d="m6.34 17.66-1.41 1.41" />
              <path d="m19.07 4.93-1.41 1.41" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="relative z-10">
      <section class="mx-auto max-w-6xl px-4 pb-6 pt-8 sm:px-6 sm:pb-8 sm:pt-10">
        <p
          class="flex items-center gap-2 font-mono text-[11px] uppercase tracking-[0.2em] text-subtle"
        >
          <span class="size-1.5 rounded-full bg-accent" aria-hidden="true"></span>
          About Denohub
        </p>
        <h1 class="mt-3 text-[28px] font-semibold leading-tight tracking-tight sm:text-4xl">
          关于 Denohub
        </h1>
        <p class="mt-3 max-w-2xl text-sm leading-relaxed text-muted sm:text-[15px]">
          Denohub 是一个子站集合，把游戏、开发与 AI 方向的实验放在同一个域名下。
        </p>
        <p class="mt-2 max-w-2xl text-sm leading-relaxed text-muted sm:text-[15px]">
          每个子站独立构建和迭代，这里是它们的统一入口。目前收录
          <span id="site-count">7</span> 个子站。
        </p>
      </section>

      <section class="mx-auto max-w-6xl px-4 pb-4 sm:px-6" aria-labelledby="principles-heading">
        <h2 id="principles-heading" class="sr-only">Denohub 的定位</h2>
        <div class="grid gap-3 sm:grid-cols-3 sm:gap-4">
          <div class="rounded-xl border border-line bg-surface p-5">
            <p class="font-mono text-[11px] uppercase tracking-[0.18em] text-subtle">01</p>
            <h3 class="mt-3 text-sm font-semibold">一个入口</h3>
            <p class="mt-1.5 text-[13px] leading-relaxed text-muted">
              集中浏览所有子站，不用记住每个域名。
            </p>
          </div>
          <div class="rounded-xl border border-line bg-surface p-5">
            <p class="font-mono text-[11px] uppercase tracking-[0.18em] text-subtle">02</p>
            <h3 class="mt-3 text-sm font-semibold">各自独立</h3>
            <p class="mt-1.5 text-[13px] leading-relaxed text-muted">
              每个子站有自己的功能、技术栈与迭代节奏。
            </p>
          </div>
          <div class="rounded-xl border border-line bg-surface p-5">
            <p class="font-mono text-[11px] uppercase tracking-[0.18em] text-subtle">03</p>
            <h3 class="mt-3 text-sm font-semibold">持续更新</h3>
            <p class="mt-1.5 text-[13px] leading-relaxed text-muted">
              新的实验和工具会陆续加入这个导航。
            </p>
          </div>
        </div>
      </section>

      <section class="mx-auto max-w-6xl px-4 pt-8 sm:px-6 sm:pt-10" aria-labelledby="sites-heading">
        <div>
          <h2 id="sites-heading" class="text-lg font-semibold tracking-tight">子站列表</h2>
          <p class="mt-1 text-sm text-muted">按分类排列，点击卡片直接访问。</p>
        </div>
        <div
          id="site-grid"
          class="mt-4 grid gap-3 sm:mt-5 sm:grid-cols-2 sm:gap-4 lg:grid-cols-3"
        ></div>
        <noscript>
          <p class="mt-6 text-sm text-muted">需要启用 JavaScript 才能查看子站列表。</p>
        </noscript>
      </section>
    </main>

    <footer class="relative z-10 mt-16 border-t border-line">
      <div
        class="mx-auto flex max-w-6xl flex-col gap-1.5 px-4 py-8 sm:flex-row sm:items-center sm:justify-between sm:px-6"
      >
        <p class="text-xs text-subtle">© <span id="year">2026</span> denohub</p>
        <p class="text-xs text-subtle">由 Rsbuild 与 Tailwind CSS 构建</p>
      </div>
    </footer>
  </body>
</html>
